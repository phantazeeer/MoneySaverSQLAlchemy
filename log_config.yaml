version: 1
disable_existing_loggers: false
formatters:
  default:
    "()": uvicorn.logging.DefaultFormatter
    fmt: "%(asctime)s,%(msecs)03d - %(levelprefix)s -  %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    use_colors: true
  access:
    "()": uvicorn.logging.AccessFormatter
    fmt: '%(asctime)s,%(msecs)03d - %(levelprefix)s - %(client_addr)20s - "%(request_line)s" %(status_code)s'
    datefmt: "%Y-%m-%d %H:%M:%S"
    use_colors: true
  error:
    "()": uvicorn.logging.DefaultFormatter
    fmt: '%(asctime)s,%(msecs)03d - %(levelprefix)s - %(module)20s - %(message)s'
    datefmt: "%Y-%m-%d %H:%M:%S"
    use_colors: true
handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout
  error:
    formatter: error
    class: logging.StreamHandler
    stream: ext://sys.stderr
  file:
    formatter: default
    class: logging.handlers.RotatingFileHandler
    filename: app.log
    mode: "a"
    encoding: "utf-8"
    maxBytes: 10485760
    backupCount: 3
loggers:
  uvicorn:
    handlers:
      - default
      - file
    level: INFO
    propagate: false
  uvicorn.error:
    handlers:
      - file
      - error
    level: INFO
    propagate: false
  uvicorn.access:
    handlers:
      - access
      - file
    level: INFO
    propagate: false