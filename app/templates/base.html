<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MoneySaver{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
<header class="border-b border-slate-200 bg-white sticky top-0 z-40">
    <div class="max-w-6xl mx-auto flex justify-between items-center px-6 py-3">
        <a href="/" class="flex items-center gap-2 text-xl font-bold text-emerald-600">
            <span class="text-2xl">💰</span> MoneySaver
        </a>
        {% if user %}
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600">
            <a href="/" class="hover:text-emerald-600 transition">Главная</a>
            <a href="/change_record" class="hover:text-emerald-600 transition">Записи</a>
            <a href="/statistics" class="hover:text-emerald-600 transition">Статистика</a>
        </nav>
        <a href="/logout"
           class="text-sm font-medium bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-700 rounded-xl px-4 py-2 transition">
            Выйти
        </a>
        {% else %}
        <div class="flex gap-2">
            <a href="/login" class="text-sm font-medium text-slate-700 hover:text-emerald-600 px-4 py-2 transition">Войти</a>
            <a href="/register"
               class="text-sm font-medium bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl px-4 py-2 transition">
                Регистрация
            </a>
        </div>
        {% endif %}
    </div>
</header>
{% block body %}{% endblock %}
</body>
</html>
