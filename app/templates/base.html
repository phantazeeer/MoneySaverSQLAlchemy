<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}
        {% endblock %}
    </title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<header>
    <header class="border-b border-slate-100 py-3 bg-gray-100">
        <div class="flex justify-between mx-4 text-xl">
            <h5 class="py-1 px-1">MoneySaver</h5>
            {% if user %}
            <a href="/logout"
               class="cursor-pointer text-[#000000] bg-[#ffc107] border-[#ffc107] border-2 rounded-sm hover:text-gray-500 py-1 px-5">
                Выйти
            </a>
            {% else %}
            <a href="/register"
               class="cursor-pointer text-[#000000] bg-[#ffc107] border-[#ffc107] border-2 rounded-sm hover:text-gray-500 py-1 px-5">
                Зарегистрироваться
            </a>
            {% endif %}
        </div>
    </header>
</header>
<body>
{% block body %}
{% endblock %}
</body>
</html>
