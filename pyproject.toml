[project]
name = "MoneySaver"
version = "0.1.0"
description = "Веб-приложение для учета доходов и расходов пользователей, которое поможет вам стать более финансово грамотным"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi[all]>=0.136.1",
    "matplotlib>=3.10.9",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.12.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.49",
    "wtforms>=3.2.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["alembic/**"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I",
    "B", "C4", "RUF",
    "FAST", "COM812",
]

ignore = [
    "B008",
    "F405",
    "F403",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T201", "SLF001", "ANN", "D"]
"__init__.py" = ["F401"]
"conftest.py" = ["D"]
"app/db/models/**" = ["F821"]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
indent-style = "space"
