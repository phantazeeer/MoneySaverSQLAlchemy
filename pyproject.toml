[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["alembic/**"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I",
    "B", "C4", "RUF",
    "FAST", "COM812",
]

ignore = [
    "B008",
    "F405",
    "F403",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T201", "SLF001", "ANN", "D"]
"__init__.py" = ["F401"]
"conftest.py" = ["D"]
"app/db/models/**" = ["F821"]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
indent-style = "space"
