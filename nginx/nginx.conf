user nginx;
worker_processes auto;
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ─── Базовые настройки ───────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;                  # скрыть версию Nginx

    keepalive_timeout 65;
    keepalive_requests 1000;

    # ─── Лимиты клиентских запросов ──────────────────────────────────────────
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;

    # ─── Сжатие ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ─── Rate limiting зоны ──────────────────────────────────────────────────
    # Общий лимит на все API запросы
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Жёсткий лимит для auth эндпоинтов (защита от brute force)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    limit_req_zone $server_name zone=total_rps:10m rate=5000r/s;

    # Лимит соединений с одного IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;


    # Статус код при превышении лимита (429 Too Many Requests)
    limit_req_status 429;
    limit_conn_status 429;


    include /etc/nginx/conf.d/*.conf;
}
