# ─── Основной сервер ─────────────────────────────────────────────────────────
server {
    listen 80;
#    server_name localhost;    # замени на свой домен в продакшене

    # ─── Защита: блокировка ботов и плохих методов ───────────────────────────
    if ($bad_bot)    { return 403; }
    if ($bad_method) { return 405; }

    # ─── Защитные заголовки ──────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Запрет прямого доступа к скрытым файлам (.env, .git и т.п.) ─────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ─── Блокировка типичных путей атак ──────────────────────────────────────
    # Сканеры ищут эти пути в первую очередь
    location ~* (wp-admin|wp-login|xmlrpc|phpmyadmin|\.php$) {
        return 404;
    }

    # ─── Защита от SQL-инъекций и XSS в URL ──────────────────────────────────
    # Блокировать запросы с явно вредоносными паттернами в URL
    set $block_sql 0;
    if ($query_string ~* "union.*select.*\(") { set $block_sql 1; }
    if ($query_string ~* "exec.*\(")          { set $block_sql 1; }
    if ($query_string ~* "drop.*table")       { set $block_sql 1; }
    if ($query_string ~* "<script>")          { set $block_sql 1; }
    if ($block_sql = 1) { return 403; }

    # ─── Auth эндпоинты — жёсткий rate limit ─────────────────────────────────
    location ~ ^/user/(auth|login|token|register) {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://backend:8000;
    }

    # ─── Healthcheck denied ───────────────
    location ~ ^/(healthcheck) {
        # добавить внутренний ip для мониторинга

        proxy_pass http://backend:8000;
    }
    location = /favicon.ico {
        alias /etc/nginx/favicon.png;
        log_not_found off; # Не записывать в лог, если файла нет
        access_log off;    # Не записывать в лог доступа
    }

    # ─── Основной API ─────────────────────────────────────────────────────────
    location / {
        limit_req zone=api_limit burst=40 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://backend:8000;
    }

    # ─── Страницы ошибок ─────────────────────────────────────────────────────
    # error_page 429 /429.json;
    # error_page 502 503 504 /50x.json;

    # location = /429.json {
    #     internal;
    #     default_type application/json;
    #     return 429 '{"detail":"Too many requests. Please slow down."}';
    # }

    # location = /50x.json {
    #    internal;
    #    default_type application/json;
    #    return 502 '{"detail":"Service temporarily unavailable."}';
    #}
}