# ─── Блокировка ботов и сканеров ─────────────────────────────────────────────
# Если User-Agent пустой или равен "-" — почти всегда сканер/бот
map $http_user_agent $bad_bot {
    default         0;
    ""              1;   # пустой User-Agent
    "-"             1;   # прочерк вместо User-Agent
    "~*sqlmap"      1;   # SQLmap — инструмент SQL-инъекций
    "~*nikto"       1;   # Nikto — сканер уязвимостей
    "~*nmap"        1;   # Nmap — сетевой сканер
    "~*masscan"     1;   # Masscan — быстрый портсканер
    "~*zgrab"       1;   # ZGrab — инструмент для сбора баннеров
}

# ─── Блокировка подозрительных методов ───────────────────────────────────────
map $request_method $bad_method {
    default  0;
    TRACE    1;    # TRACE может использоваться для XST атаки
    TRACK    1;    # аналог TRACE
    DELETE   0;    # разрешён (может понадобиться для REST API)
    PATCH    0;    # разрешён
}

# ─── Default server — отклонять запросы на неизвестный Host ──────────────────
#server {
